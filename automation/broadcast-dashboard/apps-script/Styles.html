<style>
  :root {
    color-scheme: light;
    --bg: #f4f5f7;
    --surface: #ffffff;
    --surface-2: #f8f9fb;
    --border: #e3e6eb;
    --text: #14171c;
    --text-2: #4f5663;
    --muted: #7a818d;
    --accent: #2a78d6;
    --accent-ink: #ffffff;
    --accent-soft: #e6f0fc;
    --good: #0f7b3e;
    --good-soft: #e3f4ea;
    --bad: #c62d2c;
    --bad-soft: #fdeceb;
    --warn: #a86400;
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --series-3: #1baf7a;
    --grid: #eceef1;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #121212;
      --surface: #1a1a19;
      --surface-2: #222221;
      --border: #33332f;
      --text: #f0efec;
      --text-2: #c3c2b7;
      --muted: #9a998f;
      --accent: #3987e5;
      --accent-soft: #1b2b40;
      --good: #4cc27a;
      --good-soft: #15301f;
      --bad: #f07a79;
      --bad-soft: #3a1c1c;
      --warn: #e0a640;
      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #199e70;
      --grid: #2a2a27;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121212; --surface: #1a1a19; --surface-2: #222221; --border: #33332f;
    --text: #f0efec; --text-2: #c3c2b7; --muted: #9a998f; --accent: #3987e5;
    --accent-soft: #1b2b40; --good: #4cc27a; --good-soft: #15301f; --bad: #f07a79;
    --bad-soft: #3a1c1c; --warn: #e0a640; --series-1: #3987e5; --series-2: #d95926;
    --series-3: #199e70; --grid: #2a2a27; --shadow: none;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { margin: 0; font-weight: 600; }
  h1 { font-size: 17px; }
  h2 { font-size: 17px; }
  h3 { font-size: 14px; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .hidden { display: none !important; }
  .spacer { flex: 1; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* Top bar */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 10px 24px; background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand p { margin: 0; }
  .brand-mark {
    display: grid; place-items: center; width: 34px; height: 34px; border-radius: 8px;
    background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 13px;
  }
  .tabs { display: flex; gap: 2px; overflow-x: auto; }
  .tab {
    border: 0; background: none; color: var(--text-2); padding: 8px 12px; border-radius: 8px;
    font: inherit; font-weight: 500; cursor: pointer; white-space: nowrap;
  }
  .tab:hover { background: var(--surface-2); color: var(--text); }
  .tab.active { background: var(--accent-soft); color: var(--accent); }
  .topbar-actions { margin-left: auto; display: flex; gap: 8px; }

  /* Buttons & inputs */
  .btn {
    border: 1px solid transparent; border-radius: 8px; padding: 8px 14px; font: inherit;
    font-weight: 500; cursor: pointer; white-space: nowrap;
  }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.primary[disabled] { opacity: .6; cursor: progress; }
  .btn.ghost { background: var(--surface); border-color: var(--border); color: var(--text); }
  .btn.ghost:hover { background: var(--surface-2); }
  .btn.link { background: none; color: var(--accent); padding: 8px 4px; }
  .btn.small { padding: 4px 10px; font-size: 12px; }
  .icon-btn {
    border: 0; background: none; color: var(--muted); font-size: 24px; line-height: 1;
    cursor: pointer; padding: 4px 8px; border-radius: 6px;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }
  input, select, textarea {
    font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; width: 100%;
  }
  input:focus, select:focus, textarea:focus, .btn:focus-visible, .tab:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  input[readonly] { background: var(--surface-2); color: var(--text-2); }
  textarea { resize: vertical; }
  label { display: block; font-size: 12px; font-weight: 500; color: var(--text-2); }
  label > input, label > select, label > textarea { display: block; margin-top: 4px; }
  .field-error { display: block; margin-top: 3px; }
  label.inline { display: flex; align-items: center; gap: 8px; }
  label.inline > select { margin-top: 0; }
  label.inline select { width: auto; }
  .req { color: var(--bad); font-weight: 600; }
  .invalid input, .invalid select, .invalid textarea { border-color: var(--bad); background: var(--bad-soft); }
  .field-error { color: var(--bad); font-size: 12px; font-weight: 500; }

  /* Filters */
  .filters {
    display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: flex-end;
    padding: 12px 24px; background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .filters label { min-width: 130px; }
  .filters select, .filters input { padding: 6px 8px; }

  main { padding: 20px 24px 48px; max-width: 1440px; margin: 0 auto; }
  .section-title { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 10px; }
  .section-title:first-of-type { margin-top: 6px; }

  /* KPI cards */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .kpi {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; box-shadow: var(--shadow);
  }
  .kpi .label { font-size: 12px; color: var(--text-2); font-weight: 500; }
  .kpi .value { font-size: 24px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .kpi .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .kpi .delta { font-size: 12px; font-weight: 500; margin-top: 4px; }
  .delta.up { color: var(--good); }
  .delta.down { color: var(--bad); }
  .delta.flat { color: var(--muted); }

  /* Cards & charts */
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; box-shadow: var(--shadow); margin-top: 16px; min-width: 0;
  }
  .card.flush { padding: 0; overflow: hidden; }
  .card-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .card-head h3 { margin-right: auto; }
  .card-head select { width: auto; padding: 4px 8px; font-size: 12px; }
  .chart-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 16px; }
  .chart-box { position: relative; height: 280px; }
  .empty { display: grid; place-items: center; height: 100%; color: var(--muted); font-size: 13px; text-align: center; }

  /* Tables */
  .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .toolbar input[type="search"] { max-width: 340px; }
  .toolbar select { width: auto; }
  .toolbar p { margin: 0; }
  .table-wrap { overflow-x: auto; }
  table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.data th, table.data td { padding: 9px 12px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
  table.data th {
    background: var(--surface-2); color: var(--text-2); font-weight: 600; font-size: 12px;
    white-space: nowrap; position: sticky; top: 0;
  }
  table.sortable th[data-key] { cursor: pointer; user-select: none; }
  table.sortable th[data-key]:hover { color: var(--text); }
  th .arrow { color: var(--accent); }
  table.data tbody tr.clickable { cursor: pointer; }
  table.data tbody tr:hover { background: var(--surface-2); }
  table.data td.name { min-width: 200px; font-weight: 500; }
  table.data td.name .sub { font-weight: 400; color: var(--muted); font-size: 12px; }
  table.data tfoot td { font-weight: 600; background: var(--surface-2); }
  .pill {
    display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600;
    background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); white-space: nowrap;
  }
  .pill.Sent { background: var(--good-soft); color: var(--good); border-color: transparent; }
  .pill.Draft { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .pill.Cancelled { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
  .best { background: var(--good-soft); color: var(--good); font-weight: 600; }
  .rank { color: var(--muted); width: 28px; }

  /* Compare */
  .compare-pickers { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }

  /* Modals */
  .modal {
    position: fixed; inset: 0; z-index: 50; background: rgba(10, 12, 16, .45);
    display: flex; align-items: flex-start; justify-content: center; padding: 32px 16px; overflow-y: auto;
  }
  .modal-panel {
    background: var(--surface); color: var(--text); border-radius: 14px; width: 100%; max-width: 560px;
    padding: 20px 24px; box-shadow: 0 20px 50px rgba(0, 0, 0, .25);
  }
  .modal-panel.wide { max-width: 920px; }
  .modal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 8px; }
  .modal-head p { margin: 2px 0 0; }
  fieldset { border: 0; border-top: 1px solid var(--border); margin: 12px 0 0; padding: 12px 0 0; }
  legend { font-weight: 600; font-size: 13px; padding-right: 8px; }
  .hint { margin: 0 0 10px; }
  .form-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .form-grid.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .form-grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .span2 { grid-column: span 2; }
  .span3 { grid-column: 1 / -1; }
  .full { grid-column: 1 / -1; }
  .form-actions { display: flex; align-items: center; gap: 8px; margin-top: 16px; }
  .form-error {
    margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: var(--bad-soft);
    color: var(--bad); font-weight: 500; white-space: pre-line;
  }
  .live-metrics { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .live-metrics .chip {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 4px 10px; font-size: 12px; color: var(--text-2);
  }
  .live-metrics .chip b { color: var(--text); font-variant-numeric: tabular-nums; }
  .history { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 12px; font-size: 12px; }
  .history .entry { padding: 8px 0; border-bottom: 1px dashed var(--border); }
  .history pre { margin: 4px 0 0; white-space: pre-wrap; font: inherit; color: var(--text-2); }
  .detail-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 12px 0; }
  .detail-grid .kpi .value { font-size: 18px; }
  .message-box {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
    white-space: pre-wrap; font-size: 13px; max-height: 220px; overflow: auto;
  }
  .settings-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .stack { display: flex; flex-direction: column; gap: 12px; }

  /* Feedback */
  .loading { display: grid; place-items: center; padding: 80px 0; color: var(--muted); }
  .spinner {
    width: 32px; height: 32px; border-radius: 50%; border: 3px solid var(--border);
    border-top-color: var(--accent); animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .banner { padding: 12px 14px; border-radius: 8px; margin-bottom: 12px; }
  .banner.error { background: var(--bad-soft); color: var(--bad); }
  .banner.warn { background: var(--surface-2); border: 1px solid var(--border); color: var(--warn); margin: 12px 0 0; font-weight: 500; }
  .slot-head { display: flex; align-items: center; gap: 4px; margin: 16px 0 6px; }
  .slot-wrap { max-height: 360px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; }
  #slotTable td, #slotTable th { padding: 6px 10px; }
  #slotTable tr.day-start td { border-top: 2px solid var(--border); }
  #slotTable tr.off td:not(:first-child) { opacity: .45; }
  #slotTable input[type="checkbox"] { width: 16px; height: 16px; margin: 0; }
  .toast-stack { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 100; }
  .toast {
    min-width: 260px; max-width: 380px; padding: 12px 14px; border-radius: 10px; color: #fff;
    background: #1f2937; box-shadow: 0 10px 30px rgba(0, 0, 0, .25); font-weight: 500;
    animation: slidein .2s ease-out;
  }
  .toast.success { background: #0f7b3e; }
  .toast.error { background: #b42318; }
  @keyframes slidein { from { transform: translateY(10px); opacity: 0; } }

  @media (max-width: 1000px) {
    .chart-grid { grid-template-columns: 1fr; }
    .compare-pickers, .detail-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .form-grid.four { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .settings-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 640px) {
    .topbar, .filters { padding-left: 16px; padding-right: 16px; }
    main { padding: 16px 16px 40px; }
    .topbar-actions { margin-left: 0; width: 100%; flex-wrap: wrap; }
    .topbar-actions .btn { flex: 1 1 auto; padding: 8px 10px; }
    .filters label { min-width: calc(50% - 6px); flex: 1; }
    .form-grid, .form-grid.four, .form-grid.two, .settings-grid { grid-template-columns: 1fr; }
    .span2, .span3 { grid-column: auto; }
    .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .kpi .value { font-size: 20px; }
    .modal { padding: 0; }
    .modal-panel { border-radius: 0; min-height: 100%; padding: 16px; }
  }
</style>
